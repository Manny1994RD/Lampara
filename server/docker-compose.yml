# Lámpara hub + website for ZimaOS (or any Docker host).
#   cd server && docker compose up -d --build
# Data (accounts, sync, challenges, Bibles) is kept in ./pb_data next to this file.
services:
  lampara-hub:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: lampara-hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
    environment:
      - TZ=America/New_York
